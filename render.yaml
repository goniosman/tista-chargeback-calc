services:
  - type: web
    name: tista-chargeback-calculator
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/login_status
    envVars:
      - key: PORT
        value: 8765
      - key: HEADLESS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONMALLOC
        value: "malloc"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: TISTA_EMAIL
        sync: false
      - key: TISTA_PASSWORD
        sync: false
      # Exact address(es) of the hosted front end (Vercel / GitHub Pages), comma-separated,
      # e.g. https://tista-chargeback-calc.vercel.app - the API refuses other websites.
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: tista-profile-disk
      mountPath: /data
      sizeGB: 1
