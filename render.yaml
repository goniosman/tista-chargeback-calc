services:
  - type: web
    name: tista-chargeback-calculator
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/login_status
    envVars:
      - key: PORT
        value: 8765
      - key: HEADLESS
        value: "1"
      - key: TISTA_EMAIL
        sync: false
      - key: TISTA_PASSWORD
        sync: false
    disk:
      name: tista-profile-disk
      mountPath: /data
      sizeGB: 1
