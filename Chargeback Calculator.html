<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chargeback Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with tabs; each calculator = inputs card + live result panel, then two editable tables below. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#1b2428; --muted:#5d6b70; --line:#d9e0de; --soft:#eaf0ee;
  --accent:#0d6b62; --accent-ink:#ffffff; --danger:#b23a24; --danger-soft:#fbe9e5; --ok-soft:#e2f2ee;
  --font-head:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101617; --surface:#182022; --ink:#e6eeec; --muted:#93a4a6; --line:#2b3739; --soft:#1f2a2c;
  --accent:#4cc3b3; --accent-ink:#0b1a18; --danger:#ff9b86; --danger-soft:#33201c; --ok-soft:#1b2f2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101617; --surface:#182022; --ink:#e6eeec; --muted:#93a4a6; --line:#2b3739; --soft:#1f2a2c;
  --accent:#4cc3b3; --accent-ink:#0b1a18; --danger:#ff9b86; --danger-soft:#33201c; --ok-soft:#1b2f2c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:22px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--font-head);font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.top{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.card+.card{margin-top:16px}
h2{font-family:var(--font-head);font-size:16px;margin:0 0 14px}
.f{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;align-items:center;margin-bottom:10px}
@media(max-width:520px){.f{grid-template-columns:minmax(0,1fr)}}
.f label{font-weight:500}
.hint{grid-column:2;color:var(--muted);font-size:12px;margin-top:-2px}
@media(max-width:520px){.hint{grid-column:1}}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-mono)}
.ro{background:var(--soft);font-family:var(--font-mono);padding:7px 9px;border-radius:4px;border:1px solid var(--line)}
.result{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result h2{color:inherit;opacity:.85;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-body);font-weight:600}
.big{font-family:var(--font-head);font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;word-break:break-all}
.steps{margin:14px 0 0;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);font-family:var(--font-mono);font-size:12.5px;display:grid;gap:4px}
.steps div{display:flex;justify-content:space-between;gap:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 4px;vertical-align:middle}
td.n,th.n{text-align:right}
td .ro{text-align:right;min-height:34px}
tfoot td{border-top:2px solid var(--line);font-weight:600;padding-top:8px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{padding:4px 9px;color:var(--danger)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tier{width:100%;min-width:0;font-size:13px}
.tier td,.tier th{padding:5px 8px;border-bottom:1px solid var(--line)}
.tier tr.on td{background:var(--ok-soft);font-weight:600}
.warn{background:var(--danger-soft);color:var(--danger);padding:8px 10px;border-radius:4px;margin-top:10px;font-size:13px}
.formula{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:12px}
.sev tr.on td{background:var(--ok-soft);font-weight:600}
[hidden]{display:none!important}
.badge-cat{display:inline-block;padding:2px 7px;font-size:11px;font-weight:600;font-family:var(--font-mono);background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:4px;letter-spacing:0.02em}
.tbl-files{width:100%;border-collapse:collapse}
.tbl-files th,.tbl-files td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-files tr:hover td{background:var(--soft)}
.tbl-files tr.selected td{background:var(--ok-soft)}
.tbl-files input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
.svc-item{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge-reason{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em}
.badge-reason.Correction{background:#e0f2fe;color:#0284c7}
.badge-reason.Delay{background:#fef3c7;color:#b45309}
.badge-reason.Quality{background:#f3e8ff;color:#7e22ce}
.badge-min{background:var(--ok-soft);color:var(--ok);font-size:10.5px;font-weight:600;padding:2px 5px;border-radius:3px;margin-left:4px;white-space:nowrap}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center}
.kpi-val{font-size:26px;font-weight:700;font-family:var(--font-head);color:var(--accent)}
.kpi-lbl{font-size:11.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600}
.contractor-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;font-size:12px;font-weight:500;margin:3px 4px 3px 0}
.contractor-pill strong{color:var(--accent)}

/* Global Loading System */
#global-top-progress{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#2ecc71,var(--accent));background-size:200% 100%;animation:moveBar 1.2s linear infinite;z-index:100000;display:none}
@keyframes moveBar{0%{background-position:100% 0}100%{background-position:-100% 0}}

#global-loader-overlay{position:fixed;inset:0;background:rgba(13,17,23,0.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:99999;display:none;align-items:center;justify-content:center;transition:opacity .2s ease}
.loader-box{background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 35px rgba(0,0,0,0.6);border-radius:12px;padding:28px 36px;text-align:center;max-width:440px;width:90%;animation:popIn .25s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes popIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.loader-spinner{width:48px;height:48px;margin:0 auto 16px;border:4px solid var(--soft);border-top:4px solid var(--accent);border-right:4px solid var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loader-title{font-family:var(--font-head);font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
.loader-sub{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:14px}
.loader-cancel-btn{background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:5px 14px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s ease}
.loader-cancel-btn:hover{background:var(--line);color:var(--ink)}

/* Card Loading Overlay for Total Chargeback Cards */
.card.result{position:relative;overflow:hidden;min-height:220px}
.result-card-loader{position:absolute;inset:0;background:var(--accent);color:var(--accent-ink);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;border-radius:inherit;opacity:1;box-shadow:0 4px 20px rgba(0,0,0,0.25)}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
.result-card-spinner{width:42px;height:42px;border:3.5px solid rgba(0,0,0,0.18);border-top-color:var(--accent-ink);border-right-color:var(--accent-ink);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:12px}
.result-card-title{font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:4px;color:var(--accent-ink)}
.result-card-sub{font-size:12.5px;opacity:0.88;line-height:1.4;max-width:280px;margin-bottom:12px;color:var(--accent-ink)}
.result-card-dismiss{background:rgba(0,0,0,0.12);border:1px solid rgba(0,0,0,0.22);color:var(--accent-ink);font-size:11px;padding:4px 12px;border-radius:12px;cursor:pointer;font-weight:600;transition:all .15s ease}
.result-card-dismiss:hover{background:rgba(0,0,0,0.22)}
.btn-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.35);border-top-color:#ffffff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
</style>
<div id="global-top-progress"></div>
<div id="global-loader-overlay">
  <div class="loader-box">
    <div class="loader-spinner"></div>
    <div id="loader-title" class="loader-title">Loading...</div>
    <div id="loader-sub" class="loader-sub">Please wait while communicating with Tista...</div>
    <button type="button" class="loader-cancel-btn" onclick="hideLoading()">Dismiss</button>
  </div>
</div>
<div class="wrap">
<header style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
  <div><h1>Chargeback Calculator</h1><p class="sub">Correction and delay chargebacks, using the price list and formulas from the Excel workbook.</p></div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button id="btn-tista-login" type="button" class="btn" style="display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;">

  </div>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" data-tab="cor" aria-selected="true">Correction</button>
  <button role="tab" data-tab="del" aria-selected="false">Delay Delivery</button>
  <button role="tab" data-tab="auto" aria-selected="false">Automatic Delay</button>
  <button role="tab" data-tab="autocor" aria-selected="false">Auto Correction</button>
  <button role="tab" data-tab="batch" aria-selected="false">Batch Chargeback</button>
  <button role="tab" data-tab="cfg" aria-selected="false">Price List</button>
</nav>
<main id="pane"></main>
</div>

    if (h !== 'localhost' && h !== '127.0.0.1') return window.location.origin;

function parseDur(t){ // [h]:mm:ss -> days

const fmtDur = s => { s=Math.round(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); };
function pixRange(txt){
  if(!txt) return ''; const t=String(txt).trim(); if(PIX.includes(t)) return t;
  const nums=(t.replace(/,/g,'').match(/\d+(?:\.\d+)?/g)||[]).map(Number); if(!nums.length) return '';
  const n=Math.max(...nums);
  if(/[<]/.test(t)&&nums.length===1) return n<=1000?PIX[0]:PIX.find(x=>false)||'';
  return n<1000?PIX[0]:n<=2000?PIX[1]:n<=3000?PIX[2]:n<=4000?PIX[3]:n<=5000?PIX[4]:PIX[5];
}
function analyzeAuto(a){
  const w=[], f={};
  f.order_id = a.order_id;
  f.dispute_id = a.dispute_id;
  const reason = String(a.dispute_reason || 'Delay').trim();
  f.reason = reason;
  const isDelay = !reason || reason.toLowerCase().includes('delay');
  f.isDelay = isDelay;
  f.isCorrection = !isDelay;

  const loc = String(a.contractor || a.dispute_location || '').trim();
  if(loc){
    const con = contractors().find(c=>c.toLowerCase()===loc.toLowerCase()) ||
                contractors().find(c=>c.toLowerCase().includes(loc.toLowerCase()) || loc.toLowerCase().includes(c.toLowerCase()));
    if(con) {
      f.contractor = con;
    } else {
      f.contractor = loc;
      if(!S.cfg.contractors.includes(loc)) {
        S.cfg.contractors.push(loc);
      }
    }
  } else {
    w.push('Dispute location was not found in contractor list. Please verify.');
  }

  const q = a.fault_quantity != null ? a.fault_quantity : (a.quantity != null ? a.quantity : null);
  if(q != null) f.qty = q; else w.push('Fault quantity was not found.');
  if(a.comment) f.comment = a.comment;
  if(a.comment_link) f.comment_link = a.comment_link;
  if(a.filenames && a.filenames.length) {
    f.filenames = a.filenames;
    f.qty = a.filenames.length;
  }

  const sevRaw = String(a.fault_severity || '').toLowerCase();
  f.sev = (sevRaw.includes('high') || sevRaw.includes('critical')) ? 'Major' : ((sevRaw.includes('med')) ? 'Medium' : 'Minor');

  if(isDelay){
    const sec = a.delay_seconds != null ? a.delay_seconds : (a.delayed_by_seconds != null ? -Math.abs(a.delayed_by_seconds) : (a.delayed_by_hours != null ? -Math.abs(a.delayed_by_hours*3600) : null));
    if(sec != null) f.sec = sec; else w.push('Delayed by was not found.');

    if(a.order_duration_seconds > 0) f.dur = fmtDur(a.order_duration_seconds);
    else if(a.order_duration_text) f.dur = a.order_duration_text;
    else if(a.dur) f.dur = a.dur;
    else w.push('Order duration was not found. Enter it manually in Delay tab.');
  }

  const px = pixRange(a.pixel); if(px) f.pix = px; else w.push('Pixel range was not found. Select it manually.');

  if(a.service_type) f.service = a.service_type;
  if(a.category_level) f.cat = a.category_level;
  if(a.average_category != null) f.avg = a.average_category;

  const sv = (a.services || []).map(x => ({s: x.service, c: parseFloat(String(x.category).replace(/[^\d.]/g, '')), q: x.quantity == null ? null : +x.quantity})).filter(x => isFinite(x.c));
  if(!f.service || !f.cat){
    if(!sv.length){
      if(!f.service) f.service = 'Clipping path';
      if(!f.cat) f.cat = 'Category 1';
      w.push('Services / Categories not found in filter dropdown.');
    } else {
      const known = services();
      const withSvc = sv.filter(x => x.s && known.find(k => k.toLowerCase() === x.s.toLowerCase()));
      const use = withSvc.length ? withSvc : sv;
      const weighted = use.every(x => x.q > 0);
      const tw = use.reduce((s, x) => s + (weighted ? x.q : 1), 0);
      const avg = use.reduce((s, x) => s + x.c * (weighted ? x.q : 1), 0) / tw;
      if(f.avg == null) f.avg = avg;
      if(!f.service){
        const top = use.slice().sort((a, b) => (b.q || 0) - (a.q || 0))[0];
        f.service = top && top.s ? known.find(k => k.toLowerCase() === top.s.toLowerCase()) || top.s : 'Clipping path';
      }
      if(!f.cat){
        const cats = catsOf(f.service).map(c => ({c, n: parseFloat(c.replace(/[^\d.]/g, ''))})).sort((a, b) => Math.abs(a.n - avg) - Math.abs(b.n - avg));
        f.cat = cats[0] ? cats[0].c : 'Category 1';
      }
    }
  }
  return {f, w};
}

      ℹ️ This is a <strong>${esc(f.reason)} Dispute</strong> (Dispute ID: ${esc(f.dispute_id||'—')}). Quality & Correction formulas apply: Unit Price &times; Severity Multiplier &times; Fault Qty (Min $2.00).
    </div>
    ${row('Dispute Reason', f.reason)}
    ${row('Dispute ID', f.dispute_id||'—')}
    ${row('Contractor Name', f.contractor)}
    ${row('Service Type', f.service)}
    ${row('Category Level', f.cat + (f.avg!=null ? ` (Average: ${f.avg.toFixed(2)})` : ''))}
    ${row('Pixel Range', f.pix)}
    ${row('Fault Quantity', f.qty)}
    ${row('Fault Severity', f.sev + ` (${Math.round(sevMult*100)}%)`)}
    ${row('Unit Price', p!==null ? money(p) : 'Not in price list')}
    ${calcTot > 0 && calcTot < 2.0 ? row('Calculated', money(calcTot)) : ''}
    ${row('Final Chargeback Amount', money(tot) + (calcTot > 0 && calcTot < 2.0 ? ' <span class="badge-min">Min $2.00 applied</span>' : ''))}

    </div>`;
  }

  const days=parseDur(f.dur), delayDays=Math.abs(num(f.sec))/3600/24, pct=days>0?delayDays/days:0;
  const t=tierFor(pct), r=t?t.r:0, q=num(f.qty);

  return `<h2>Order #${esc(a.order_id||'')} Summary <span class="badge-reason Delay" style="font-size:12px;vertical-align:middle;margin-left:6px">Delay</span></h2>

  ${row('Calculated Delay %',(pct*100).toFixed(2)+'% (Share: '+Math.round(r*100)+'%)')}
  ${row('Unit Price',p!==null ? money(p) : 'Not in price list')}
  ${calcTot > 0 && calcTot < 2.0 ? row('Calculated', money(calcTot)) : ''}
  ${row('Est. Chargeback Amount', money(tot) + (calcTot > 0 && calcTot < 2.0 ? ' (Min $2.00 applied)' : ''))}

async function fetchLiveTista(idInputId='au-id', statusId='au-status', autoApply=false){
  const el = $(idInputId);
  const oid = (el ? el.value : '').trim().replace(/\D/g,'');
  if(!oid){ alert('Please enter an Order ID first.'); return; }
  const status = $(statusId);
  const fetchBtn = $(idInputId==='del-quick-id'?'del-quick-fetch':'au-fetch-live');
  const origBtnText = fetchBtn ? fetchBtn.innerHTML : '';
  if(fetchBtn){
    fetchBtn.disabled = true;
    fetchBtn.innerHTML = '<span class="btn-spinner"></span> Fetching...';
  }
  if(status){
    status.textContent = 'Connecting to Tista... (check browser window if login is required)';
    status.style.color = 'var(--accent)';
  }
  showLoading(`Fetching Order #${oid}`, 'Connecting to Tista & retrieving order details...');
  try {
    const res = await fetch(`${API_BASE}/api/fetch?order_id=${oid}`);
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    importAuto(data);
    if(autoApply) applyAuto();
    if(status){
      status.textContent = '✓ Fetched & Calculated Order #' + oid + ' successfully!';
      status.style.color = 'green';
    }
  } catch (err) {
    if(status){
      status.textContent = '⚠️ ' + (err.message || 'Could not connect to helper.');
      status.style.color = 'var(--danger)';
    }
  } finally {
    hideLoading();
    if(fetchBtn){
      fetchBtn.disabled = false;
      fetchBtn.innerHTML = origBtnText || (autoApply ? 'Fetch from Tista' : '⚡ Fetch from Tista (Live)');
    }
  }
}

async function extractFilesFromDelLink(){
  const input = $('del-link-input');
  const status = $('del-link-status');
  const btn = $('del-link-extract-btn');
  const url = (input ? input.value : '').trim();
  if(!url){
    if(status) { status.textContent = 'Please enter a URL'; status.style.color = 'var(--danger)'; }
    return;
  }
  if(btn) { btn.disabled = true; btn.innerHTML = '<span class="btn-spinner"></span> Extracting...'; }
  if(status) { status.textContent = 'Extracting files from link...'; status.style.color = 'var(--accent)'; }
  try {
    const res = await fetch(`${API_BASE}/api/fetch_link_files?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if(data.success && data.filenames && data.filenames.length){
      S.del.comment_link = url;
      S.del.filenames = data.filenames;
      S.del.qty = data.filenames.length;
      save(); render();
      if($('del-link-status')) {
        $('del-link-status').textContent = `✓ Extracted ${data.filenames.length} files! Set Quantity = ${data.filenames.length}`;
        $('del-link-status').style.color = 'green';
      }
    } else {
      if(status) { status.textContent = 'No filenames found in link.'; status.style.color = 'var(--danger)'; }
    }
  } catch(e) {
    if(status) { status.textContent = 'Error: ' + e.message; status.style.color = 'var(--danger)'; }
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = '⚡ Extract Files'; }
  }
}

function paneAutoCor(){
  const auto = S.corAuto;
  const files = (auto && auto.files) ? auto.files : [];
  const selSet = new Set(S.corSelectedIds || []);
  const selectedFiles = files.filter(f => selSet.has(f.id));
  const selCount = selectedFiles.length;

  const pool = selectedFiles.length ? selectedFiles : files;
  const allSvcs = [...new Set(pool.flatMap(f => (f.services||[]).map(s => s.service)).filter(Boolean))];
  if(!allSvcs.length) allSvcs.push('Camera reflection removal');
  if(!S.corService || !allSvcs.includes(S.corService)){
    S.corService = allSvcs[0];
  }

  const relevantCats = [];
  selectedFiles.forEach(f => {
    const match = (f.services||[]).find(s => s.service === S.corService);
    if(match && Number.isFinite(match.numeric_cat)) relevantCats.push(match.numeric_cat);
  });
  const avgCatNum = relevantCats.length ? (relevantCats.reduce((a,b)=>a+b, 0) / relevantCats.length) : null;

  const availableCats = catsOf(S.corService);
  const catVal = c => { const m = String(c).match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 1; };
  let recommendedCat = availableCats[0] || 'Category 1';
  if(avgCatNum !== null && availableCats.length > 0){
    recommendedCat = availableCats.reduce((prev, curr) => Math.abs(catVal(curr) - avgCatNum) < Math.abs(catVal(prev) - avgCatNum) ? curr : prev, availableCats[0]);
  }
  if(!S.corCatManual || !availableCats.includes(S.corCat)){
    S.corCat = recommendedCat;
  }

  const contractor = (auto && auto.contractor) || (selectedFiles[0] ? selectedFiles[0].location : '') || S.cor.contractor || 'Edgebo';
  const uPrice = price(S.corService, S.corCat, S.corPix);
  const pr = uPrice || 0;
  const sevMult = SEV[S.corSev] || 1.5;

  const visibleFiles = files.filter(f => {
    if(!q) return true;
    const sNames = (f.services||[]).map(s => (s.service + ' ' + (s.raw_name||''))).join(' ');
    return f.filename.toLowerCase().includes(q) || sNames.toLowerCase().includes(q) || (f.location||'').toLowerCase().includes(q);

function parsePastedFilenames(rawText){
  if(!rawText) return [];
  const rawItems = String(rawText).split(/[\r\n,;\t]+/);
  const result = [];
  rawItems.forEach(item => {
    let s = item.trim();
    if(!s) return;
    s = s.replace(/^["'`\[\]]+|["'`\[\]]+$/g, '').trim();
    if(s.includes('/') || s.includes('\\')) s = s.split(/[/\\]/).pop().trim();
    if(s && s.length >= 1) result.push(s);
  });
  return result;
}

function matchAndSelectFiles(rawText, mode='replace'){
  if(!S.corAuto || !S.corAuto.files || !S.corAuto.files.length){
    alert('Please fetch or load order files first.');
    return;
  }
  const targets = parsePastedFilenames(rawText);
  if(!targets.length){
    alert('Please enter or paste at least one filename first.');
    return;
  }

  const files = S.corAuto.files;
  const matchedSet = new Set(mode === 'add' ? (S.corSelectedIds || []) : []);
  const foundTargets = new Set();
  const notFoundTargets = [];

  targets.forEach(target => {
    const tNorm = target.toLowerCase();
    const tBase = tNorm.replace(/\.[a-z0-9]+$/i, '');

    let foundForTarget = false;
    files.forEach(f => {
      const fNorm = (f.filename || '').toLowerCase();
      const fBase = fNorm.replace(/\.[a-z0-9]+$/i, '');

      if(fNorm === tNorm || fBase === tBase || (tNorm.length >= 3 && (fNorm.includes(tNorm) || tNorm.includes(fNorm)))){
        matchedSet.add(f.id);
        foundForTarget = true;
      }
    });

    if(foundForTarget){
      foundTargets.add(target);
    } else {
      notFoundTargets.push(target);
    }
  });

  S.corSelectedIds = Array.from(matchedSet);
  S.corCatManual = false;
  S.corPasteText = rawText;
  save();
  render();

  const statusEl = $('aucor-match-status');
  if(statusEl){
    const selCount = S.corSelectedIds.length;
    if(notFoundTargets.length === 0){
      statusEl.textContent = `✓ ${selCount} matching file${selCount === 1 ? '' : 's'} successfully selected!`;
      statusEl.style.color = '#27ae60';
    } else {
      const missingStr = notFoundTargets.slice(0, 3).join(', ') + (notFoundTargets.length > 3 ? ` (+${notFoundTargets.length - 3} more)` : '');
      statusEl.textContent = `✓ ${selCount} selected (${notFoundTargets.length} not found: ${missingStr})`;
      statusEl.style.color = selCount > 0 ? '#e67e22' : 'var(--danger)';
    }
  }
}

function importAutoCor(txt){
  try {
    const o = typeof txt === 'string' ? JSON.parse(txt) : txt;
    if(!o || !o.files) throw 0;
    S.corAuto = o;
    S.corAutoId = o.order_id || S.corAutoId;
    S.corSelectedIds = [];
    S.corService = '';
    S.corCat = '';
    if(o.contractor) S.cor.contractor = o.contractor;
    save();
    render();
    if($('aucor-err')) $('aucor-err').textContent = '';
  } catch(e) {
    if($('aucor-err')) $('aucor-err').textContent = 'Invalid files result file.';
  }
}

function applyAutoCor(){
  if(!S.corAuto || !S.corAuto.files) return;
  const files = S.corAuto.files;
  const selSet = new Set(S.corSelectedIds || []);
  const selCount = files.filter(f => selSet.has(f.id)).length;
  if(selCount === 0){
    alert('Please select at least one file first.');

  const contractor = $('aucor-contractor') ? $('aucor-contractor').value : (S.corAuto.contractor || S.cor.contractor);
  S.cor.contractor = contractor;

  S.cor.cat = S.corCat;
  S.cor.pix = S.corPix;
  S.cor.sev = S.corSev;

  save();
  render();
}

async function fetchQuickCorrectionTab(oid, statusId='cor-quick-status'){
  oid = String(oid || '').trim().replace(/\D/g, '');
  if(!oid){ alert('Please enter an Order ID first.'); return; }
  const status = $(statusId);
  const fetchBtn = $('cor-quick-fetch');
  const origBtnText = fetchBtn ? fetchBtn.innerHTML : '';
  if(fetchBtn){
    fetchBtn.disabled = true;
    fetchBtn.innerHTML = '<span class="btn-spinner"></span> Fetching...';
  }
  if(status){
    status.textContent = 'Connecting to Tista & fetching dispute...';
    status.style.color = 'var(--accent)';
  }
  showLoading(`Fetching Order #${oid}`, 'Connecting to Tista & calculating Correction chargeback...');
  try {
    const res = await fetch(`${API_BASE}/api/fetch?order_id=${oid}`);
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    S.auto = data;
    S.autoId = oid;
    S.corAutoId = oid;
    S.corDisputeId = data.dispute_id || '';

    const { f } = analyzeAuto(data);
    if(f.contractor) S.cor.contractor = f.contractor;
    if(f.service) S.cor.service = f.service;
    if(f.cat) S.cor.cat = f.cat;
    if(f.pix) S.cor.pix = f.pix;
    if(f.sev) S.cor.sev = f.sev;
    if(f.qty != null) S.cor.qty = f.qty;

    S.tab = 'cor';
    save();
    render();

    const st = $(statusId);
    if(st){
      st.textContent = `✓ Fetched & Calculated Order #${oid} successfully!`;
      st.style.color = '#27ae60';
    }
  } catch(err){
    if(status){
      status.textContent = '⚠️ ' + (err.message || 'Could not connect to helper.');
      status.style.color = 'var(--danger)';
    }
  } finally {
    hideLoading();
    const btnAfter = $('cor-quick-fetch');
    if(btnAfter){
      btnAfter.disabled = false;
      btnAfter.innerHTML = origBtnText || '⚡ Fetch & Calculate';
    }
  }
}

async function importFromGoogleSlides(slideUrl){
  const url = String(slideUrl || ($('bt-slides-url') ? $('bt-slides-url').value : '')).trim();
  if(!url){
    alert('Please enter or paste a Google Slides link first.');
    return;
  }
  const statusEl = $('bt-slides-status') || $('bt-status-text');
  if(statusEl){
    statusEl.textContent = 'Connecting to Google Slides & parsing report slides...';
    statusEl.style.color = 'var(--accent)';
  }
  showLoading('Fetching Google Slides...', 'Extracting Order IDs, Services, Severities, and File Names from presentation slides...', true);

  try {
    const res = await fetch(`${API_BASE}/api/fetch_slides?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Failed to fetch slides');
    
    if(!data.jobs || !data.jobs.length){
      throw new Error('No dispute/correction jobs found in this presentation.');
    }

    const newDisputes = data.jobs.map((job, i) => {
      const oid = String(job.order_id).replace(/\D/g, '');
      const rawSvc = String(job.service || 'Clipping path').trim();
      const allKnown = services();
      const matchedSvc = allKnown.find(k => k.toLowerCase() === rawSvc.toLowerCase())
                      || allKnown.find(k => rawSvc.toLowerCase().includes(k.toLowerCase()))
                      || allKnown.find(k => k.toLowerCase().includes(rawSvc.toLowerCase()))
                      || rawSvc;
      const svc = matchedSvc;
      const availableCats = catsOf(svc).length ? catsOf(svc) : ['Category 1', 'Category 1.5', 'Category 2'];
      const cat = availableCats.includes('Category 1.5') ? 'Category 1.5' : (availableCats[0] || 'Category 1');
      const qty = (job.fault_qty != null && job.fault_qty > 0) ? job.fault_qty : ((job.filenames && job.filenames.length) ? job.filenames.length : (job.total_qty || 1));

      let rReason = String(job.reason || job.report_type || 'Correction').trim();
      if(rReason.toLowerCase().includes('quality')) rReason = 'Quality';
      else if(rReason.toLowerCase().includes('delay')) rReason = 'Delay';
      else if(rReason.toLowerCase().includes('revision')) rReason = 'Revision';
      else if(rReason.toLowerCase().includes('technical')) rReason = 'Technical fault';
      else if(rReason.toLowerCase().includes('correction')) rReason = 'Correction';
      else rReason = rReason || 'Correction';

      return {
        dispute_id: 'SLIDE-' + oid,
        order_id: '#' + oid,
        contractor: job.contractor || 'Other',
        fault_by: job.contractor || 'Other',
        dispute_reason: rReason,
        chargeable_to: 'Vendor',
        fault_at: new Date().toISOString().slice(0, 10),
        delayed_by: '',
        delay_seconds: 0,
        order_duration: '24:00:00',
        fault_quantity: qty,
        fault_severity: job.severity || 'Minor',
        status: 'Awaiting response from vendor',
        service: svc,
        cat: cat,
        pix: '> 5000',
        is_all_images: !!job.is_all_images,
        filenames: job.filenames || [],
        order_services: [svc],
        order_cats: availableCats
      };
    });

    if(!S.batch) S.batch = { filters: {} };
    if(!S.batch.filters) S.batch.filters = {};
    const firstReason = newDisputes[0]?.dispute_reason || 'Correction';
    if(firstReason === 'Quality') S.batch.filters.reason = '4';
    else if(firstReason === 'Delay') S.batch.filters.reason = '1';
    else if(firstReason === 'Correction') S.batch.filters.reason = '2';
    else if(firstReason === 'Revision') S.batch.filters.reason = '3';
    else if(firstReason === 'Technical fault') S.batch.filters.reason = '5';

    S.batch.disputes = newDisputes;
    S.batch.slideUrl = url;
    S.batch.showSlides = true;
    S.batchStatusText = `✓ Successfully imported ${newDisputes.length} orders from Google Slides!`;
    S.batchStatusColor = '#27ae60';
    save();
    render();

    if(statusEl){
      statusEl.textContent = `✓ Successfully imported ${newDisputes.length} orders from Google Slides!`;
      statusEl.style.color = '#27ae60';
    }
  } catch(err){
    if(statusEl){
      statusEl.textContent = '⚠️ ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }
    alert('Google Slides Import Error: ' + err.message);
  } finally {
    hideLoading();
  }
}

function calcDisputeChargeback(d){
  const qty = num(d.fault_quantity || 1);
  const reason = (d.dispute_reason || 'Correction').trim();
  const svc = d.service || 'Clipping path';
  const cat = d.cat || 'Category 1.5';
  const pix = d.pix || '> 5000';
  const uPrice = price(svc, cat, pix);
  const pr = uPrice || 0;

  if(reason.toLowerCase() === 'delay'){
    const durStr = d.order_duration || d.dur || '24:00:00';
    const durDays = parseDur(durStr) || 1;
    const sec = num(d.delay_seconds || d.sec || 0);
    const delayDays = Math.abs(sec) / 86400;
    const pct = durDays > 0 ? delayDays / durDays : 0;
    const t = tierFor(pct);
    const share = t ? t.r : 0;
    const raw = pr * share * qty;
    const finalAmount = raw > 0 ? Math.max(2.0, raw) : 0;
    return {
      reason: 'Delay',
      svc, cat, pix, pr, qty,
      factorLabel: (pct * 100).toFixed(1) + '% (Tier: ' + Math.round(share * 100) + '%)',
      rawAmount: raw,
      chargeback: finalAmount,
      minApplied: raw > 0 && raw < 2.0
    };
  } else {
    // Correction and Quality share the EXACT same rule!
    const sevRaw = (d.fault_severity || 'Low').toLowerCase();
    let sevKey = 'Minor';
    if(sevRaw.includes('med')) sevKey = 'Medium';
    else if(sevRaw.includes('high') || sevRaw.includes('crit') || sevRaw.includes('maj')) sevKey = 'Major';
    else if(sevRaw.includes('mult')) sevKey = 'Multiple';
    else sevKey = 'Minor';

    const mult = SEV[sevKey] || 1.5;
    const raw = pr * mult * qty;
    const finalAmount = raw > 0 ? Math.max(2.0, raw) : 0;
    return {
      reason: reason,
      svc, cat, pix, pr, qty,
      sevKey,
      factorLabel: sevKey + ' (' + Math.round(mult * 100) + '%)',
      rawAmount: raw,
      chargeback: finalAmount,
      minApplied: raw > 0 && raw < 2.0
    };
  }
}

function setBatchDatePreset(type){
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const end = fmt(now);
  let start = '';
  if(type === 'today') {
    start = end;
  } else if(type === '7d') {
    const d = new Date(); d.setDate(d.getDate() - 7);
    start = fmt(d);
  } else if(type === '14d') {
    const d = new Date(); d.setDate(d.getDate() - 14);
    start = fmt(d);
  } else if(type === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth(), 1);
    start = fmt(d);
  } else if(type === 'clear') {
    start = '';
  }
  if(!S.batch) S.batch = { filters: {} };
  if(!S.batch.filters) S.batch.filters = {};
  S.batch.filters.dateStart = start;
  S.batch.filters.dateEnd = (type === 'clear' ? '' : end);
  if($('bt-date-start')) $('bt-date-start').value = S.batch.filters.dateStart;
  if($('bt-date-end')) $('bt-date-end').value = S.batch.filters.dateEnd;
  save();
}

async function fetchLiveBatchDisputes(customQuery=null){
  const statusEl = $('bt-status-text');
  const b = S.batch || { filters: {} };
  const f = b.filters || {};
  
  const query = customQuery !== null ? customQuery : ($('bt-query') ? $('bt-query').value : (f.query || ''));
  const reason = $('bt-reason') ? $('bt-reason').value : (f.reason !== undefined ? f.reason : '2');
  const status = $('bt-status') ? $('bt-status').value : (f.status !== undefined ? f.status : '1');
  const chargeable = $('bt-chargeable') ? $('bt-chargeable').value : (f.chargeable !== undefined ? f.chargeable : '1');
  const location = $('bt-location') ? $('bt-location').value : (f.location || '');
  const dateStart = $('bt-date-start') ? $('bt-date-start').value : (f.dateStart || '');
  const dateEnd = $('bt-date-end') ? $('bt-date-end').value : (f.dateEnd || '');
  const deepScan = $('bt-deep') ? $('bt-deep').checked : (f.deepScan || false);

  f.query = query;
  f.reason = reason;
  f.status = status;
  f.chargeable = chargeable;
  f.location = location;
  f.dateStart = dateStart;
  f.dateEnd = dateEnd;
  f.deepScan = deepScan;
  save();

  S.batchStatusText = 'Searching disputes on Tista... (please wait)';
  S.batchStatusColor = 'var(--accent)';
  if(statusEl){
    statusEl.textContent = S.batchStatusText;
    statusEl.style.color = S.batchStatusColor;
  }
  showLoading('Searching Batch Disputes...', 'Fetching disputes from Tista according to selected filters...');

  try {
    const params = {
      reason, status, chargeable, location, query,
      start_date: dateStart,
      end_date: dateEnd,
      deep_scan: deepScan ? '1' : '0'
    };
    const qs = new URLSearchParams(params).toString();

    const res = await fetch(`${API_BASE}/api/fetch_disputes?${qs}`);
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    S.batch.disputes = data.disputes || [];
    S.batchStatusText = `✓ Fetched ${data.total_disputes || data.disputes.length} disputes successfully!`;
    S.batchStatusColor = 'green';
    save();
    render();
  } catch(err){
    S.batchStatusText = '⚠️ ' + (err.message || 'Could not connect to helper.');
    S.batchStatusColor = 'var(--danger)';
    save();
    render();
  } finally {
    hideLoading();
  }
}

function exportBatchCSV(){
  const b = S.batch || { disputes: [] };
  const disputes = b.disputes || [];
  if(!disputes.length){ alert('No disputes to export.'); return; }

  const headers = ['Index', 'Order ID', 'Fault at', 'Reason', 'Contractor', 'Service', 'Category', 'Severity/Tier', 'Fault Quantity', 'Unit Price ($)', 'Raw Calculated ($)', 'Final Chargeback ($)', 'Min $2 Applied', 'Status'];
  const rows = disputes.map((d, i) => {
    const r = calcDisputeChargeback(d);
    return [
      i + 1,
      `"${d.order_id}"`,
      `"${d.fault_at||''}"`,
      `"${r.reason}"`,
      `"${d.contractor}"`,
      `"${r.svc}"`,
      `"${r.cat}"`,
      `"${r.factorLabel}"`,
      r.qty,
      r.pr.toFixed(2),
      r.rawAmount.toFixed(2),
      r.chargeback.toFixed(2),
      r.minApplied ? 'Yes' : 'No',
      `"${d.status}"`
    ].join(',');
  });

  const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', `Chargeback_Disputes_Summary_${new Date().toISOString().slice(0,10)}.csv`);

async function closeDisputeLive(orderId, disputeId, amount, statusId, btnId){
  const statusEl = $(statusId);
  const btnEl = $(btnId);
  const cleanOid = (orderId || '').trim();
  const cleanDid = (disputeId || '').trim();
  if(!cleanOid && !cleanDid){
    alert('Please enter or fetch an Order ID or Dispute ID first.');
    return;
  }
  const amt = Math.max(2.0, num(amount || 2.0));

  if(!confirm(`Are you sure you want to Charge $${amt.toFixed(2)} to Vendor and Close the dispute for ${cleanOid ? 'Order #' + cleanOid : 'Dispute #' + cleanDid} on Tista?`)){
    return;
  }

  const origBtnText = btnEl ? btnEl.innerHTML : '';
  if(btnEl){
    btnEl.disabled = true;
    btnEl.innerHTML = `<span class="btn-spinner"></span> Charging $${amt.toFixed(2)} & Closing...`;
  }
  if(statusEl){
    statusEl.textContent = 'Connecting to Tista & closing dispute...';
    statusEl.style.color = 'var(--accent)';
  }
  showLoading('Closing Dispute on Tista...', `Charging $${amt.toFixed(2)} to vendor & updating status to Closed...`);

  try {
    const res = await fetch(`${API_BASE}/api/close_dispute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_id: cleanOid,
        dispute_id: cleanDid,
        amount: amt
      })
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Server error ' + res.status);
    if(statusEl){
      statusEl.textContent = `✓ Successfully charged $${data.amount.toFixed(2)} to Vendor & Closed dispute #${data.dispute_id || cleanDid}!`;
      statusEl.style.color = '#27ae60';
    }
    if(S.batch && S.batch.disputes){
      const match = S.batch.disputes.find(x => (cleanDid && x.dispute_id === cleanDid) || (cleanOid && x.order_id && x.order_id.includes(cleanOid)));
      if(match){
        match.status = 'Closed';
        match.charge = data.amount;
        save();
        render();
      }
    }
  } catch(err){
    if(statusEl){
      statusEl.textContent = '⚠️ Error: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }
  } finally {
    hideLoading();
    if(btnEl){
      btnEl.disabled = false;
      btnEl.innerHTML = origBtnText || '🔒 Charge to Vendor & Close Dispute on Tista';
    }
  }
}

async function closeBatchAll(){
  const b = S.batch || { disputes: [] };
  const disputes = b.disputes || [];
  const q = (b.filterQ || '').toLowerCase().trim();
  const computedList = disputes.map((d, i) => ({ orig: d, idx: i, res: calcDisputeChargeback(d) }));
  const visibleList = computedList.filter(item => {
    if(!q) return true;
    const text = [item.orig.order_id, item.orig.contractor, item.orig.dispute_reason, item.orig.service, item.orig.status].join(' ').toLowerCase();
    return text.includes(q);
  });

  const unclosed = visibleList.filter(it => !it.orig.status || !it.orig.status.toLowerCase().includes('close'));
  if(!unclosed.length){
    alert('All visible disputes are already closed.');
    return;
  }

  const totalAmt = unclosed.reduce((acc, it) => acc + it.res.chargeback, 0);
  if(!confirm(`Are you sure you want to Charge to Vendor and Close ${unclosed.length} disputes on Tista?\nTotal Chargeback: $${totalAmt.toFixed(2)}`)){
    return;
  }

  const statusEl = $('bt-status-text');
  const btnEl = $('bt-close-all');
  if(btnEl) btnEl.disabled = true;

  const items = unclosed.map(it => ({
    dispute_id: it.orig.dispute_id,
    order_id: it.orig.order_id,
    amount: it.res.chargeback
  }));

  if(statusEl){
    statusEl.textContent = `Batch closing ${items.length} disputes on Tista... (please wait)`;
    statusEl.style.color = 'var(--accent)';
  }
  showLoading('Batch Closing Disputes on Tista...', `Processing ${items.length} visible disputes ($${totalAmt.toFixed(2)}). Please wait...`);

  try {
    const res = await fetch(`${API_BASE}/api/batch_close_disputes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ disputes: items })
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Server error ' + res.status);

    (data.results || []).forEach(r => {
      if(r.success){
        const match = disputes.find(x => (r.dispute_id && x.dispute_id === r.dispute_id) || (r.order_id && x.order_id === r.order_id));
        if(match){
          match.status = 'Closed';
          match.charge = r.amount;
        }
      }
    });

    S.batchStatusText = `✓ Successfully charged & closed ${data.closed || 0} of ${data.total || items.length} disputes on Tista!`;
    S.batchStatusColor = '#27ae60';
    save();
    render();
  } catch(err){
    if(statusEl){
      statusEl.textContent = '⚠️ Batch close error: ' + err.message;
      statusEl.style.color = 'var(--danger)';
    }
  } finally {
    hideLoading();
    if(btnEl) btnEl.disabled = false;
  }
}

      }
    }
    else if(id === 'bt-severity') S.batch.filters.severity = e.target.value;
    else if(id === 'bt-status') S.batch.filters.status = e.target.value;
    else if(id === 'bt-location') S.batch.filters.location = e.target.value;
    else if(id === 'bt-chargeable') S.batch.filters.chargeable = e.target.value;
    else if(id === 'bt-deep') S.batch.filters.deepScan = e.target.checked;
    else if(id === 'bt-date-start') S.batch.filters.dateStart = e.target.value;
    else if(id === 'bt-date-end') S.batch.filters.dateEnd = e.target.value;
    save();
    return;
  }
  if(e.target.tagName==='SELECT'){
    if(e.target.id==='aucor-service'){ S.corService=e.target.value; S.corCatManual=false; S.corCat=''; save(); render(); return; }
    if(e.target.id==='aucor-cat'){ S.corCat=e.target.value; S.corCatManual=true; save(); render(); return; }
    if(e.target.id==='aucor-pix'){ S.corPix=e.target.value; save(); render(); return; }
    if(e.target.id==='aucor-sev'){ S.corSev=e.target.value; save(); render(); return; }
    if(e.target.id==='aucor-contractor'){ S.cor.contractor=e.target.value; save(); render(); return; }
    onChange(e);
  }
  if(e.target.id==='aucor-file'&&e.target.files[0]){ const r=new FileReader(); r.onload=()=>importAutoCor(String(r.result)); r.readAsText(e.target.files[0]); }
  if(e.target.id==='au-file'&&e.target.files[0]){ const r=new FileReader(); r.onload=()=>importAuto(String(r.result)); r.readAsText(e.target.files[0]); } });
pane.addEventListener('click',e=>{
  
  const trFile = e.target.closest('tr[data-fid]');
  if(trFile && !e.target.closest('button')){
    const fid = +trFile.dataset.fid;
    const idx = S.corSelectedIds.indexOf(fid);
    if(idx >= 0) S.corSelectedIds.splice(idx, 1);
    else S.corSelectedIds.push(fid);
    S.corCatManual = false;
    save(); render(); return;
  }

  const t=e.target.closest('button'); if(!t) return;
  const tr=t.closest('tr[data-w]');
  if(t.dataset.del&&tr){ S[tr.dataset.k][tr.dataset.w].splice(+tr.dataset.i,1); save(); render(); }
  else if(t.dataset.add){ const [k,w]=t.dataset.add.split(':'); S[k][w].push({s:'',c:'',p:'',q:''}); save(); render(); }
  else if(t.dataset.clear){ const [k,w]=t.dataset.clear.split(':'); S[k][w]=blank(6); save(); render(); }
  else if(t.dataset.cdel){ S.prices.splice(+t.closest('tr').dataset.i,1); save(); fillCfg(); }
  else if(t.id==='au-import'){ const v=$('au-json').value.trim(); if(v) importAuto(v); else $('au-err').textContent='Choose a file or paste the JSON.'; }
  else if(t.id==='au-fetch-live') fetchLiveTista('au-id','au-status',false);
  else if(t.id==='del-quick-fetch') fetchLiveTista('del-quick-id','del-quick-status',true);
  else if(t.id==='del-link-extract-btn') extractFilesFromDelLink();
  else if(t.id==='cor-quick-fetch') fetchQuickCorrectionTab($('cor-quick-id').value, 'cor-quick-status');
  else if(t.id==='cor-quick-files') fetchLiveCorrection($('cor-quick-id').value, 'cor-quick-status');
  else if(t.id==='aucor-fetch-live') fetchLiveCorrection($('aucor-id').value, 'aucor-status');
  else if(t.id==='aucor-import-toggle'){ S.corShowImport=!S.corShowImport; render(); }
  else if(t.id==='aucor-import-btn'){ const v=$('aucor-json').value.trim(); if(v) importAutoCor(v); else if($('aucor-err')) $('aucor-err').textContent='Choose a file or paste JSON.'; }
  else if(t.id==='aucor-load-sample'){ S.corAuto=SAMPLE_COR_457696; S.corSelectedIds=[]; S.corAutoId='457696'; S.corCatManual=false; save(); render(); }
  else if(t.id==='aucor-select-all'){ S.corSelectedIds=(S.corAuto.files||[]).map(f=>f.id); S.corCatManual=false; save(); render(); }
  else if(t.id==='aucor-deselect-all'){ S.corSelectedIds=[]; S.corCatManual=false; save(); render(); }
  else if(t.id==='aucor-toggle-paste'){ S.corShowPasteNames = (S.corShowPasteNames === false ? true : false); save(); render(); }
  else if(t.id==='aucor-btn-match-select'){ matchAndSelectFiles($('aucor-paste-names') ? $('aucor-paste-names').value : '', 'replace'); }
  else if(t.id==='aucor-btn-match-add'){ matchAndSelectFiles($('aucor-paste-names') ? $('aucor-paste-names').value : '', 'add'); }
  else if(t.id==='aucor-btn-paste-clear'){ if($('aucor-paste-names')) $('aucor-paste-names').value = ''; S.corPasteText = ''; if($('aucor-match-status')) $('aucor-match-status').textContent = ''; save(); }
  else if(t.id==='aucor-apply') applyAutoCor();
  else if(t.id==='aucor-chk-all'){
    const all = (S.corAuto.files||[]).map(f=>f.id);
    S.corSelectedIds = (S.corSelectedIds.length === all.length) ? [] : all;
    S.corCatManual=false;
    save(); render();
  }
  else if(t.id==='au-apply') applyAuto();
  else if(t.id==='au-apply-cor') applyAutoCorDirect();
  else if(t.id==='au-copy'){ const c=$('au-cmd').textContent; try{ navigator.clipboard.writeText(c).then(()=>t.textContent='Copied',()=>{}); }catch(x){} }
  else if(t.id==='bt-preset-today') setBatchDatePreset('today');
  else if(t.id==='bt-preset-7d') setBatchDatePreset('7d');
  else if(t.id==='bt-preset-14d') setBatchDatePreset('14d');
  else if(t.id==='bt-preset-month') setBatchDatePreset('month');
  else if(t.id==='bt-preset-clear') setBatchDatePreset('clear');
  else if(t.id==='bt-search') fetchLiveBatchDisputes();
  else if(t.id==='bt-sample'){ S.batch.disputes = SAMPLE_BATCH_DATA.disputes || []; save(); render(); }
  else if(t.id==='bt-toggle-paste'){ S.batch.showPaste = !S.batch.showPaste; render(); }
  else if(t.id==='bt-toggle-slides'){ S.batch.showSlides = !S.batch.showSlides; render(); }
  else if(t.id==='bt-slides-go'){
    const v = $('bt-slides-url') ? $('bt-slides-url').value.trim() : '';
    if(v) importFromGoogleSlides(v);
  }
  else if(t.id==='bt-paste-go'){
    const v = $('bt-paste-input') ? $('bt-paste-input').value.trim() : '';
    if(v) fetchLiveBatchDisputes(v);
  }
  else if(t.id==='bt-export-csv') exportBatchCSV();
  else if(t.id==='bt-copy-table') copyBatchSummary();
  else if(t.dataset.btOpen !== undefined) openDisputeInCalc(+t.dataset.btOpen);
  else if(t.dataset.btClose !== undefined) closeBatchRow(+t.dataset.btClose);
  else if(t.id==='bt-close-all') closeBatchAll();
  else if(t.id==='cor-close-btn'){
    const d=S.cor;
    const p=price(d.service,d.cat,d.pix)||0;
    const m=SEV[d.sev]||0;
    const q=num(d.qty);
    const calcTot=p*m*q;
    const tot = calcTot > 0 ? Math.max(2.0, calcTot) : 2.0;
    const oid = S.corAutoId || ($('cor-quick-id') ? $('cor-quick-id').value : '');
    closeDisputeLive(oid, '', tot, 'cor-close-status', 'cor-close-btn');
  }
  else if(t.id==='del-close-btn'){
    const d=S.del;
    const p=price(d.service,d.cat,d.pix)||0;
    const days=parseDur(d.dur);
    const delayDays=Math.abs(num(d.sec))/3600/24;
    const pct=days>0?delayDays/days:0;
    const tr=tierFor(pct);
    const r=tr?tr.r:0;
    const q=num(d.qty);
    const calcTot=p*r*q;
    const tot = calcTot > 0 ? Math.max(2.0, calcTot) : 2.0;
    const oid = S.autoId || ($('del-quick-id') ? $('del-quick-id').value : '');
    closeDisputeLive(oid, '', tot, 'del-close-status', 'del-close-btn');
  }
  else if(t.id==='cf-reset'){ S.prices=DEF().prices; save(); render(); }
  else if(t.id==='cfg-save-api'){
    const val = ($('cfg-api-url') ? $('cfg-api-url').value.trim() : '');
    if(val) {
      localStorage.setItem('tista_api_base', val.replace(/\/+$/, ''));
      alert('Backend API URL saved! Reloading calculator...');
      window.location.reload();
    }
  }
  else if(t.id==='cfg-reset-api'){
    localStorage.removeItem('tista_api_base');
    alert('Reset to default API detection! Reloading calculator...');
    window.location.reload();
  }
  else if(t.id==='nw-add'){ const s=$('nw-s').value.trim(),c=$('nw-c').value.trim(),p=$('nw-p').value,v=num($('nw-v').value);
    if(!s||!c||!$('nw-v').value) return;
    const ex=S.prices.find(r=>r.s===s&&r.c===c&&r.p===p); if(ex) ex.v=v; else S.prices.push({s,c,p,v});
    save(); render(); }
});
render();

// ---------- Tista Login Helper & Live Status ----------
async function checkTistaLoginStatus() {
  try {
    const res = await fetch(`${API_BASE}/api/login_status`);
    if(!res.ok) return;
    const data = await res.json();
    const txt = $('tista-status-text');
    const dot = $('tista-status-dot');
    const savedUser = localStorage.getItem('tista_logged_user');
    if(data.logged_in) {
      if(txt) txt.textContent = savedUser ? `🟢 ${savedUser}` : '🟢 Tista Logged In';
      if(dot) dot.style.background = '#2ecc71';
    } else {
      if(txt) txt.textContent = '🔑 Tista Login';
      if(dot) dot.style.background = '#e3b341';
    }
  } catch(e) {
    // Offline / serverless mode
  }
}

function triggerTistaLogin() {
  const isRemote = API_BASE.includes('onrender.com') || (window.location.protocol.startsWith('http') && !API_BASE.includes('127.0.0.1') && !API_BASE.includes('localhost'));

  if (isRemote) {
    const modal = $('tista-login-modal');
    if (modal) {
      modal.style.display = 'flex';
      $('modal-login-err').style.display = 'none';
      setTimeout(() => $('modal-tista-email').focus(), 100);
      return;
    }
  }

  showLoading('Connecting to Tista...', 'A browser window will open. Enter your email and password, check "Remember me", and click "Sign in".', true);
  fetch(`${API_BASE}/api/login`)
    .then(r => r.json())
    .then(data => {
      if(data.status === 'success') {
        alert('✓ Tista Login Successful! Your session has been permanently saved.');
        checkTistaLoginStatus();
      } else {
        alert('Tista Login: ' + (data.error || 'Failed to login'));
      }
    })
    .catch(err => {
      alert('Tista Login Error: ' + err.message);
    })
    .finally(() => {
      hideLoading();
      checkTistaLoginStatus();
    });
}

async function submitTistaModalLogin() {
  const email = $('modal-tista-email').value.trim();
  const password = $('modal-tista-password').value;
  const btn = $('modal-btn-submit');
  const errDiv = $('modal-login-err');

  if(!email || !password) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span> তিস্তায় যাচাই করা হচ্ছে...';
  errDiv.style.display = 'none';

  try {
    const res = await fetch(`${API_BASE}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(data.status === 'success') {
      localStorage.setItem('tista_logged_user', email);
      $('tista-login-modal').style.display = 'none';
      alert(`✓ স্বাগতম! তিস্তা অ্যাকাউন্ট (${email}) সফলভাবে লগইন হয়েছে।`);
      checkTistaLoginStatus();
    } else {
      errDiv.textContent = '❌ লগইন ব্যর্থ হয়েছে: ' + (data.error || 'ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।');
      errDiv.style.display = 'block';
    }
  } catch(err) {
    errDiv.textContent = '❌ সার্ভার সংযোগে ত্রুটি: ' + err.message;
    errDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'সাইন-ইন করুন &rarr;';
  }
}

if($('btn-tista-login')) {
  $('btn-tista-login').addEventListener('click', triggerTistaLogin);
}
checkTistaLoginStatus();
